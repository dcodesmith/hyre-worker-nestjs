# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Hyre Worker Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    # if: false  # Temporarily disabled - remove this line to re-enable
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    environment:
      name: development
      url: https://hyre-worker-nestjs.fly.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      OPERATIONS_EMAIL: ${{ vars.OPERATIONS_EMAIL }}
      TWILIO_BOOKING_STATUS_UPDATE_CONTENT_SID: ${{ vars.TWILIO_BOOKING_STATUS_UPDATE_CONTENT_SID }}
      TWILIO_CLIENT_BOOKING_LEG_START_REMINDER_CONTENT_SID: ${{ vars.TWILIO_CLIENT_BOOKING_LEG_START_REMINDER_CONTENT_SID }}
      TWILIO_CHAUFFEUR_BOOKING_LEG_START_REMINDER_CONTENT_SID: ${{ vars.TWILIO_CHAUFFEUR_BOOKING_LEG_START_REMINDER_CONTENT_SID }}
      TWILIO_CLIENT_BOOKING_LEG_END_REMINDER_CONTENT_SID: ${{ vars.TWILIO_CLIENT_BOOKING_LEG_END_REMINDER_CONTENT_SID }}
      TWILIO_CHAUFFEUR_BOOKING_LEG_END_REMINDER_CONTENT_SID: ${{ vars.TWILIO_CHAUFFEUR_BOOKING_LEG_END_REMINDER_CONTENT_SID }}
      TWILIO_BOOKING_CONFIRMATION_CONTENT_SID: ${{ vars.TWILIO_BOOKING_CONFIRMATION_CONTENT_SID }}
      TWILIO_BOOKING_CANCELLATION_CLIENT_CONTENT_SID: ${{ vars.TWILIO_BOOKING_CANCELLATION_CLIENT_CONTENT_SID }}
      TWILIO_BOOKING_CANCELLATION_FLEET_OWNER_CONTENT_SID: ${{ vars.TWILIO_BOOKING_CANCELLATION_FLEET_OWNER_CONTENT_SID }}
      TWILIO_FLEET_OWNER_BOOKING_NOTIFICATION_CONTENT_SID: ${{ vars.TWILIO_FLEET_OWNER_BOOKING_NOTIFICATION_CONTENT_SID }}
      TWILIO_BOOKING_EXTENSION_CONFIRMATION_CONTENT_SID: ${{ vars.TWILIO_BOOKING_EXTENSION_CONFIRMATION_CONTENT_SID }}
      TWILIO_FLIGHT_OPERATIONAL_UPDATE_CONTENT_SID: ${{ vars.TWILIO_FLIGHT_OPERATIONAL_UPDATE_CONTENT_SID }}
      TWILIO_PAYOUT_SUCCEEDED_CONTENT_SID: ${{ vars.TWILIO_PAYOUT_SUCCEEDED_CONTENT_SID }}
      TWILIO_REFUND_SUCCEEDED_CONTENT_SID: ${{ vars.TWILIO_REFUND_SUCCEEDED_CONTENT_SID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@v1.4
      - name: Deploy to Fly.io
        run: |
          flyctl deploy --remote-only \
            --env "OPERATIONS_EMAIL=$OPERATIONS_EMAIL" \
            --env "TWILIO_BOOKING_STATUS_UPDATE_CONTENT_SID=$TWILIO_BOOKING_STATUS_UPDATE_CONTENT_SID" \
            --env "TWILIO_CLIENT_BOOKING_LEG_START_REMINDER_CONTENT_SID=$TWILIO_CLIENT_BOOKING_LEG_START_REMINDER_CONTENT_SID" \
            --env "TWILIO_CHAUFFEUR_BOOKING_LEG_START_REMINDER_CONTENT_SID=$TWILIO_CHAUFFEUR_BOOKING_LEG_START_REMINDER_CONTENT_SID" \
            --env "TWILIO_CLIENT_BOOKING_LEG_END_REMINDER_CONTENT_SID=$TWILIO_CLIENT_BOOKING_LEG_END_REMINDER_CONTENT_SID" \
            --env "TWILIO_CHAUFFEUR_BOOKING_LEG_END_REMINDER_CONTENT_SID=$TWILIO_CHAUFFEUR_BOOKING_LEG_END_REMINDER_CONTENT_SID" \
            --env "TWILIO_BOOKING_CONFIRMATION_CONTENT_SID=$TWILIO_BOOKING_CONFIRMATION_CONTENT_SID" \
            --env "TWILIO_BOOKING_CANCELLATION_CLIENT_CONTENT_SID=$TWILIO_BOOKING_CANCELLATION_CLIENT_CONTENT_SID" \
            --env "TWILIO_BOOKING_CANCELLATION_FLEET_OWNER_CONTENT_SID=$TWILIO_BOOKING_CANCELLATION_FLEET_OWNER_CONTENT_SID" \
            --env "TWILIO_FLEET_OWNER_BOOKING_NOTIFICATION_CONTENT_SID=$TWILIO_FLEET_OWNER_BOOKING_NOTIFICATION_CONTENT_SID" \
            --env "TWILIO_BOOKING_EXTENSION_CONFIRMATION_CONTENT_SID=$TWILIO_BOOKING_EXTENSION_CONFIRMATION_CONTENT_SID" \
            --env "TWILIO_FLIGHT_OPERATIONAL_UPDATE_CONTENT_SID=$TWILIO_FLIGHT_OPERATIONAL_UPDATE_CONTENT_SID" \
            --env "TWILIO_PAYOUT_SUCCEEDED_CONTENT_SID=$TWILIO_PAYOUT_SUCCEEDED_CONTENT_SID" \
            --env "TWILIO_REFUND_SUCCEEDED_CONTENT_SID=$TWILIO_REFUND_SUCCEEDED_CONTENT_SID"
      - name: Show deployment logs
        run: |
          echo "=== Recent deployment logs ==="
          flyctl logs --app hyre-worker-nestjs -n | head -100 || true
          echo "=== Machine status ==="
          flyctl status --app hyre-worker-nestjs || true
      - name: Verify deployment
        run: |
          # Wait for app to be healthy (check if machines are running)
          DEPLOY_SUCCESS=false
          for i in {1..60}; do
            if flyctl status --json | jq -e '[.Machines[]? | select(.state == "started")] | length > 0' > /dev/null 2>&1; then
              echo "Deployment verified: machines are running"
              DEPLOY_SUCCESS=true
              break
            fi
            echo "Waiting for machines to start... (attempt $i/60)"
            # Show logs every 10 attempts to see progress
            if [ $((i % 10)) -eq 0 ]; then
              echo "=== Recent logs (check $i) ==="
              flyctl logs --app hyre-worker-nestjs -n | head -20 || true
            fi
            sleep 5
          done
          # Final log check
          echo "=== Final logs ==="
          flyctl logs --app hyre-worker-nestjs -n | head -50 || true
          if [ "$DEPLOY_SUCCESS" != "true" ]; then
            echo "Error: Deployment verification timed out - no machines reached 'started' state"
            exit 1
          fi
