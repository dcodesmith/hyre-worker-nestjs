# Runs from the base branch so cleanup still happens after the PR branch is deleted.
# pull_request_target is safe here: we only destroy apps named after the PR number
# and never check out or execute untrusted PR code beyond this workflow file on main.
name: Preview Cleanup (Neon + Fly)

on:
  pull_request_target:
    types:
      - closed

concurrency:
  # Match fly-preview.yml so closing a PR cancels any in-flight deployment
  # before teardown starts.
  group: preview-pr-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete preview resources
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PREVIEW_APP: hyre-worker-nestjs-pr-${{ github.event.number }}
      REDIS_APP: hyre-worker-redis-pr-${{ github.event.number }}
      NEON_BRANCH: preview/pr-${{ github.event.number }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@v1.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Delete preview R2 objects
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_IMAGES_BUCKET_NAME: hyre-assets-images-development
          R2_DOCS_BUCKET_NAME: hyre-assets-docs-development
          PREVIEW_PREFIX: previews/pr-${{ github.event.number }}/
        run: |
          if [[ ! "$PREVIEW_PREFIX" =~ ^previews/pr-[1-9][0-9]*/$ ]]; then
            echo "Invalid preview storage prefix."
            exit 1
          fi
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          status=0
          for bucket in "$R2_IMAGES_BUCKET_NAME" "$R2_DOCS_BUCKET_NAME"; do
            aws s3 rm "s3://${bucket}/${PREVIEW_PREFIX}" \
              --recursive \
              --endpoint-url "$ENDPOINT" \
              --only-show-errors || status=1
          done
          exit "$status"

      - name: Install neonctl
        if: always()
        run: npm i -g neonctl@v2

      - name: Destroy preview resources
        if: always()
        run: bash scripts/cleanup-preview-resources.sh
