name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tested commit SHA or tag from main
        required: true
        default: main
      version:
        description: New production version tag (for example, v1.0.0)
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PRODUCTION_APP: hyre-worker-nestjs-production
  PRODUCTION_URL: https://hyre-worker-nestjs-production.fly.dev

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.release.outputs.deploy_sha }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - name: Checkout selected release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a commit from main
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git fetch origin main
          DEPLOY_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" origin/main; then
            echo "Selected ref must resolve to a commit contained in main."
            exit 1
          fi

          require_successful_workflow() {
            WORKFLOW_FILE="$1"
            WORKFLOW_NAME="$2"
            RUN_ID="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$WORKFLOW_FILE" \
                --commit "$DEPLOY_SHA" \
                --status success \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"
            if [ -z "$RUN_ID" ]; then
              echo "$WORKFLOW_NAME must succeed for commit $DEPLOY_SHA before production deployment."
              exit 1
            fi
          }

          require_successful_workflow e2e.yml "E2E Tests"
          require_successful_workflow typecheck.yml "Type Check"
          require_successful_workflow fly-deploy.yml "Development deployment"

          if ! printf '%s' "$RELEASE_VERSION" |
            grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Version must use stable semantic version format vMAJOR.MINOR.PATCH."
            exit 1
          fi

          if git rev-parse --quiet --verify "refs/tags/$RELEASE_VERSION" >/dev/null; then
            echo "Version tag $RELEASE_VERSION already exists."
            exit 1
          fi

          LATEST_VERSION="$(
            gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/releases" \
              -f per_page=100 \
              --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty'
          )"
          if [ -z "$LATEST_VERSION" ]; then
            if [ "$RELEASE_VERSION" != "v1.0.0" ]; then
              echo "The first stable production release must be v1.0.0."
              exit 1
            fi
          elif ! printf '%s' "$LATEST_VERSION" |
            grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Latest stable GitHub release $LATEST_VERSION is not a valid vMAJOR.MINOR.PATCH tag."
            exit 1
          else
            RELEASE_VERSION="$RELEASE_VERSION" LATEST_VERSION="$LATEST_VERSION" node - <<'NODE'
          const parse = (value) => value.slice(1).split(".").map(Number);
          const candidate = parse(process.env.RELEASE_VERSION);
          const latestRaw = process.env.LATEST_VERSION;
          const latest = parse(latestRaw);
          let comparison = 0;

          for (let index = 0; index < candidate.length; index += 1) {
            if (candidate[index] !== latest[index]) {
              comparison = candidate[index] - latest[index];
              break;
            }
          }

          if (comparison <= 0) {
            console.error(
              `Version ${process.env.RELEASE_VERSION} must be greater than ${latestRaw}.`,
            );
            process.exit(1);
          }
          NODE
          fi

          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test --run

      - name: Run type check
        run: pnpm type-check

      - name: Build application
        run: pnpm build

  deploy:
    name: Deploy approved release
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout verified release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.deploy_sha }}
          persist-credentials: false

      - name: Compute safety branch expiration
        run: echo "BACKUP_EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create production database safety branch
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: backup/production-${{ github.run_id }}-${{ github.run_attempt }}
          parent_branch: main
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.BACKUP_EXPIRES_AT }}

      - name: Resolve Neon main database URLs
        id: neon_main
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: main
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@dfdfedc86b296f5e5384f755a18bf400409a15d0 # v1.4

      - name: Verify production app exists
        run: flyctl status --app "$PRODUCTION_APP" >/dev/null

      - name: Stage production database URLs
        env:
          DATABASE_URL: ${{ steps.neon_main.outputs.db_url_pooled }}
          DIRECT_DATABASE_URL: ${{ steps.neon_main.outputs.db_url }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_DATABASE_URL" ]; then
            echo "Neon main database URLs could not be resolved."
            exit 1
          fi
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'DIRECT_DATABASE_URL=%s\n' "$DIRECT_DATABASE_URL"
          } | flyctl secrets import --stage --app "$PRODUCTION_APP"

      - name: Deploy selected release
        env:
          DEPLOYMENT_COMMIT: ${{ needs.verify.outputs.deploy_sha }}
          DEPLOYMENT_VERSION: ${{ needs.verify.outputs.release_version }}
        run: |
          flyctl deploy \
            --remote-only \
            --config fly.production.toml \
            --app "$PRODUCTION_APP" \
            --strategy rolling \
            --env "DEPLOYMENT_COMMIT=$DEPLOYMENT_COMMIT" \
            --env "DEPLOYMENT_VERSION=$DEPLOYMENT_VERSION"

      - name: Verify production health
        env:
          DEPLOYMENT_COMMIT: ${{ needs.verify.outputs.deploy_sha }}
          DEPLOYMENT_VERSION: ${{ needs.verify.outputs.release_version }}
        run: |
          for attempt in {1..30}; do
            if ROOT_RESPONSE="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$PRODUCTION_URL/")" &&
              printf '%s' "$ROOT_RESPONSE" |
                jq -e \
                  --arg version "$DEPLOYMENT_VERSION" \
                  --arg commit "$DEPLOYMENT_COMMIT" \
                  '.status == "ok"
                   and .environment == "production"
                   and .deployment.version == $version
                   and .deployment.commit == $commit' >/dev/null &&
              curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$PRODUCTION_URL/health" >/dev/null; then
              echo "Production deployment is healthy."
              exit 0
            fi
            echo "Waiting for production health (${attempt}/30)..."
            sleep 10
          done
          echo "Production health verification timed out."
          flyctl status --app "$PRODUCTION_APP" || true
          flyctl logs --app "$PRODUCTION_APP" --no-tail || true
          exit 1

      - name: Add deployment summary
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Version: \`${{ needs.verify.outputs.release_version }}\`"
            echo "- Commit: \`${{ needs.verify.outputs.deploy_sha }}\`"
            echo "- App: \`${PRODUCTION_APP}\`"
            echo "- URL: ${PRODUCTION_URL}"
            echo "- Neon branch: \`main\`"
            echo "- Safety branch: \`backup/production-${{ github.run_id }}-${{ github.run_attempt }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Tag healthy production release
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release and version tag
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.verify.outputs.deploy_sha }}
          RELEASE_VERSION: ${{ needs.verify.outputs.release_version }}
        run: |
          gh release create "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$DEPLOY_SHA" \
            --title "$RELEASE_VERSION" \
            --generate-notes

      - name: Add release summary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.release_version }}
        run: |
          RELEASE_URL="$(
            gh release view "$RELEASE_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --json url \
              --jq .url
          )"
          {
            echo "## GitHub release"
            echo ""
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- Release: ${RELEASE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
