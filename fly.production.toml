# Production Fly configuration. Deployments are manual and approval-gated.

app = "hyre-worker-nestjs-production"
primary_region = "lhr"

[env]
  APP_ENV = "production"
  APP_NAME = "Tripdly API"
  TZ = "Africa/Lagos"
  DOMAIN = "https://hyre-worker-nestjs-production.fly.dev"
  AUTH_BASE_URL = "https://hyre-worker-nestjs-production.fly.dev"
  TRUSTED_ORIGINS = "https://hyre-worker-nestjs-production.fly.dev"
  TWILIO_WEBHOOK_URL = "https://hyre-worker-nestjs-production.fly.dev/api/webhook/twilio"
  FLUTTERWAVE_BASE_URL = "https://api.flutterwave.com"
  FLUTTERWAVE_WEBHOOK_URL = "https://hyre-worker-nestjs-production.fly.dev/api/webhook/flutterwave"
  ENABLE_MANUAL_TRIGGERS = "false"
  SENDER_NAME = "Yomide"
  TWILIO_VEHICLE_CARD_CONTENT_SID = "HX43448303892f9f4026057adb597e0c22"
  TWILIO_CHECKOUT_LINK_CONTENT_SID = "HX34269684dbcb609ab817c66c719eaba3"

[deploy]
  release_command = "/bin/sh scripts/run-prisma-migrations.sh"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
